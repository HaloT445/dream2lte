name: Export upstream base

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone locked upstream base
        run: |
          git clone --filter=blob:none https://github.com/boloaimer/exynos-8895.git base
          cd base
          git checkout dcdaf6878e7f9497e1d90e25980decfa5d684f74
          rm -rf .git
      - name: Archive base tree
        run: tar -C base -czf exynos8895-base.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: exynos8895-base
          path: exynos8895-base.tar.gz
          retention-days: 1
