name: Build Android 4.19 phase 4 clock and pinctrl link

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-4.19-phase4-clock-pinctrl-link.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-link:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout materialized Linux 4.19 source
        uses: actions/checkout@v4
        with:
          ref: port/linux-4.19-source
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu libelf-dev libssl-dev python3 rsync

      - name: Fetch pinned Exynos8895 4.4 source
        run: |
          mkdir exynos8895-4.4
          git -C exynos8895-4.4 init
          git -C exynos8895-4.4 remote add origin https://github.com/boloaimer/exynos-8895.git
          git -C exynos8895-4.4 fetch --depth=1 origin dcdaf6878e7f9497e1d90e25980decfa5d684f74
          git -C exynos8895-4.4 checkout --detach FETCH_HEAD
          test "$(git -C exynos8895-4.4 rev-parse HEAD)" = "dcdaf6878e7f9497e1d90e25980decfa5d684f74"

      - name: Apply verified clock CAL and pinctrl ports
        run: |
          bash scripts/port/apply_exynos8895_clock_cal.sh \
            exynos8895-4.4 phase4-clock-cal-import-SHA256SUMS.txt
          python3 scripts/port/apply_exynos8895_clock_build_flags.py
          python3 scripts/port/audit_exynos8895_clock_namespace.py \
            | tee phase4-clock-namespace-audit.txt
          python3 scripts/port/apply_exynos8895_pinctrl.py \
            exynos8895-4.4 phase4-pinctrl-import-SHA256SUMS.txt
          grep -F 'samsung,exynos8895-pinctrl' \
            drivers/pinctrl/samsung/pinctrl-samsung.c

      - name: Merge Phase-2 Android and pinctrl configuration
        run: |
          cat > phase4-link.config <<'EOF'
          CONFIG_PINCTRL=y
          CONFIG_PINCTRL_SAMSUNG=y
          CONFIG_PINCTRL_EXYNOS=y
          CONFIG_PINCTRL_EXYNOS_ARM64=y
          EOF
          mkdir -p out-phase4-link
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            scripts/kconfig/merge_config.sh -O out-phase4-link \
            arch/arm64/configs/defconfig \
            arch/arm64/configs/alice_dream2lte_4_19_phase2.config \
            phase4-link.config \
            2>&1 | tee phase4-link-config.log
          cp out-phase4-link/.config phase4-link-final.config
          for sym in PINCTRL PINCTRL_SAMSUNG PINCTRL_EXYNOS PINCTRL_EXYNOS_ARM64; do
            grep -qx "CONFIG_${sym}=y" phase4-link-final.config
          done

      - name: Build Phase-4 Image and dream2lte DTB
        run: |
          set +e
          set -o pipefail
          make O="$GITHUB_WORKSPACE/out-phase4-link" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            Image exynos/exynos8895-dream2lte_eur_open_10.dtb \
            2>&1 | tee phase4-link-build.log
          status=${PIPESTATUS[0]}
          echo "$status" > phase4-link-exit-code.txt
          exit 0

      - name: Collect Phase-4 evidence
        if: always()
        run: |
          IMAGE=out-phase4-link/arch/arm64/boot/Image
          DTB=out-phase4-link/arch/arm64/boot/dts/exynos/exynos8895-dream2lte_eur_open_10.dtb
          if test -s "$IMAGE"; then cp "$IMAGE" Image-dream2lte-4.19-phase4; fi
          if test -s "$DTB"; then cp "$DTB" exynos8895-dream2lte_eur_open_10-phase4.dtb; fi
          : > phase4-link-SHA256SUMS.txt
          for f in Image-dream2lte-4.19-phase4 \
                   exynos8895-dream2lte_eur_open_10-phase4.dtb \
                   phase4-link-final.config; do
            if test -s "$f"; then sha256sum "$f" >> phase4-link-SHA256SUMS.txt; fi
          done
          if test -s Image-dream2lte-4.19-phase4; then
            file Image-dream2lte-4.19-phase4 | tee phase4-link-file-identification.txt
          fi
          {
            echo 'scope=host-link-gate-only'
            echo 'kernel=4.19.325'
            echo 'subsystems=Exynos8895 clock CAL PMUCAL pinctrl'
            echo 'clock_build_flags=source-local'
            echo 'pinctrl_controllers=8'
            echo 'pinctrl_banks=36'
            echo 'linux_4_19_eint_core=preserved'
            echo "build_exit=$(cat phase4-link-exit-code.txt)"
            echo 'physical_boot=not_tested'
          } > phase4-link-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream2lte-linux-4.19-phase4-clock-pinctrl-link
          path: |
            Image-dream2lte-4.19-phase4
            exynos8895-dream2lte_eur_open_10-phase4.dtb
            phase4-link.config
            phase4-link-final.config
            phase4-link-config.log
            phase4-link-build.log
            phase4-link-exit-code.txt
            phase4-link-status.txt
            phase4-link-file-identification.txt
            phase4-link-SHA256SUMS.txt
            phase4-clock-cal-import-SHA256SUMS.txt
            phase4-pinctrl-import-SHA256SUMS.txt
            phase4-clock-namespace-audit.txt
            exynos8895-clock-cal-import.files
            exynos8895-pinctrl-import.files
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce Phase-4 link result
        run: exit "$(cat phase4-link-exit-code.txt)"
