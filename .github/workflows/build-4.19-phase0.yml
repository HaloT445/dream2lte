name: Build Android 4.19 phase 0

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu libelf-dev libssl-dev python3 rsync
      - name: Fetch pinned Android 4.19 base
        run: |
          mkdir kernel-4.19
          git -C kernel-4.19 init
          git -C kernel-4.19 remote add origin https://android.googlesource.com/kernel/common
          git -C kernel-4.19 fetch --depth=1 origin a8bf86a0e0fa05070897a210d706d5c4d83c26ac
          git -C kernel-4.19 checkout --detach FETCH_HEAD
          test "$(git -C kernel-4.19 rev-parse HEAD)" = "a8bf86a0e0fa05070897a210d706d5c4d83c26ac"
      - name: Configure generic arm64
        run: |
          make -C kernel-4.19 O="$GITHUB_WORKSPACE/out-4.19" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          cp out-4.19/.config phase0-defconfig
      - name: Build generic arm64 Image
        run: |
          set -o pipefail
          make -C kernel-4.19 O="$GITHUB_WORKSPACE/out-4.19" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image 2>&1 | tee phase0-build.log
      - name: Verify output
        run: |
          test -s out-4.19/arch/arm64/boot/Image
          sha256sum out-4.19/arch/arm64/boot/Image phase0-defconfig > phase0-SHA256SUMS.txt
          cp out-4.19/arch/arm64/boot/Image Image-android-4.19-phase0
      - uses: actions/upload-artifact@v4
        with:
          name: android-4.19-phase0-build
          path: |
            Image-android-4.19-phase0
            phase0-defconfig
            phase0-build.log
            phase0-SHA256SUMS.txt
          retention-days: 7
