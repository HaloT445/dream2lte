name: Diagnose Android Common 5.15 baseline build

on:
  push:
    branches:
      - port/linux-5.15-bringup
    paths:
      - .github/workflows/diagnose-5.15-phase0-build.yml
      - scripts/port5/fetch_android14_clang.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-5.15-phase0-build.yml
      - scripts/port5/fetch_android14_clang.sh
  workflow_dispatch:

concurrency:
  group: diagnose-5.15-phase0-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose-phase0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      COMMON_URL: https://android.googlesource.com/kernel/common
      COMMON_REF: refs/heads/android14-5.15
      COMMON_SHA: b10e5e5b5c5e01d49829aec34b65a0d717d6f2f5
      COMMON_TREE: 7c3cd26c765b741df608a8b81cc6b93f1240fa36
      EVIDENCE_DIR: evidence/diagnostics/phase0-5.15

    steps:
      - name: Checkout bring-up branch
        uses: actions/checkout@v4
        with:
          ref: port/linux-5.15-bringup
          fetch-depth: 1
          persist-credentials: true

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential dwarves flex git libelf-dev \
            libssl-dev python3 rsync

      - name: Fetch pinned Android 14 Clang
        run: |
          set -euo pipefail
          chmod +x scripts/port5/fetch_android14_clang.sh
          scripts/port5/fetch_android14_clang.sh \
            "$RUNNER_TEMP/android-clang" \
            "$RUNNER_TEMP/android-clang.env"

      - name: Fetch exact Android Common source
        run: |
          set -euo pipefail
          COMMON="$RUNNER_TEMP/android-common-5.15"
          git init "$COMMON"
          git -C "$COMMON" remote add origin "$COMMON_URL"
          git -C "$COMMON" fetch --depth=1 origin "$COMMON_REF"
          git -C "$COMMON" checkout --detach FETCH_HEAD
          test "$(git -C "$COMMON" rev-parse HEAD)" = "$COMMON_SHA"
          test "$(git -C "$COMMON" rev-parse HEAD^{tree})" = "$COMMON_TREE"
          test "$(sed -n 's/^VERSION = //p' "$COMMON/Makefile")" = 5
          test "$(sed -n 's/^PATCHLEVEL = //p' "$COMMON/Makefile")" = 15

      - name: Configure and capture build result
        run: |
          set -u
          source "$RUNNER_TEMP/android-clang.env"
          export PATH="$ANDROID_CLANG_BIN:$PATH"
          COMMON="$RUNNER_TEMP/android-common-5.15"
          OUT="$RUNNER_TEMP/out-5.15-diagnostic"
          FULL_LOG="$RUNNER_TEMP/phase0-build.log"
          mkdir -p "$EVIDENCE_DIR"

          {
            cat "$RUNNER_TEMP/android-clang.env"
            echo "source_url=$COMMON_URL"
            echo "source_ref=$COMMON_REF"
            echo "source_commit=$COMMON_SHA"
            echo "source_tree=$COMMON_TREE"
            echo "runner=$(uname -a)"
            echo "clang=$(clang --version | head -n1)"
            echo "ld_lld=$(ld.lld --version | head -n1)"
            echo "pahole=$(pahole --version 2>&1 | head -n1)"
            echo "make=$(make --version | head -n1)"
          } > "$EVIDENCE_DIR/environment.txt"

          set +e
          set -o pipefail
          make -C "$COMMON" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS=-D__ANDROID_COMMON_KERNEL__ gki_defconfig \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          config_status=${PIPESTATUS[0]}

          if [ "$config_status" -eq 0 ]; then
            cp "$OUT/.config" "$EVIDENCE_DIR/gki-final.config"
            make -C "$COMMON" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              KCFLAGS=-D__ANDROID_COMMON_KERNEL__ -j2 V=1 Image \
              2>&1 | tee "$FULL_LOG"
            build_status=${PIPESTATUS[0]}
          else
            build_status=125
            : > "$FULL_LOG"
          fi
          set -e

          printf '%s\n' "$config_status" > "$EVIDENCE_DIR/configure-exit-code.txt"
          printf '%s\n' "$build_status" > "$EVIDENCE_DIR/build-exit-code.txt"

          python3 - "$FULL_LOG" "$EVIDENCE_DIR/first-errors.txt" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          lines = source.read_text(errors="replace").splitlines()
          pattern = re.compile(
              r"(?:error:|fatal error:|FAILED:|undefined reference|"
              r"No rule to make target|not found|cannot find|Killed)",
              re.IGNORECASE,
          )
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          selected = []
          seen = set()
          for index in hits[:40]:
              for current in range(max(0, index - 4), min(len(lines), index + 8)):
                  if current not in seen:
                      selected.append(f"{current + 1}: {lines[current]}")
                      seen.add(current)
          if not selected:
              start = max(0, len(lines) - 300)
              selected = [f"{i + 1}: {lines[i]}" for i in range(start, len(lines))]
          output.write_text("\n".join(selected) + "\n")
          PY

          tail -n 400 "$FULL_LOG" > "$EVIDENCE_DIR/build-tail.txt" || true

          IMAGE="$OUT/arch/arm64/boot/Image"
          {
            echo "migration=direct-4.4.302-to-5.15"
            echo "linux_4_19_dependency=none"
            echo "configure_exit=$config_status"
            echo "build_exit=$build_status"
            if [ -s "$IMAGE" ]; then
              echo "image_present=yes"
              stat -c 'image_bytes=%s' "$IMAGE"
              sha256sum "$IMAGE" | sed 's#  .*#  Image#'
            else
              echo "image_present=no"
            fi
            echo "exynos8895_imported=no"
            echo "physical_boot=not_tested"
            echo "one_ui_8=not_tested"
          } > "$EVIDENCE_DIR/status.txt"

          if [ -s "$EVIDENCE_DIR/gki-final.config" ]; then
            sha256sum "$EVIDENCE_DIR/gki-final.config" \
              > "$EVIDENCE_DIR/config-SHA256.txt"
          fi

      - name: Commit compact diagnostics
        run: |
          set -euo pipefail
          git config user.name "ALice CI"
          git config user.email "halot4004@gmail.com"
          git add "$EVIDENCE_DIR"
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit'
          else
            git commit -m "evidence: capture pinned-clang 5.15 build"
            git push origin HEAD:port/linux-5.15-bringup
          fi

      - name: Upload complete diagnostic logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream2lte-linux-5.15-phase0-diagnostics
          path: |
            evidence/diagnostics/phase0-5.15/
            ${{ runner.temp }}/phase0-build.log
          if-no-files-found: error
          retention-days: 14
