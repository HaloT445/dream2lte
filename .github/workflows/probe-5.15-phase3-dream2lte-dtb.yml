name: Probe Linux 5.15 phase 3 dream2lte DTB

on:
  push:
    branches:
      - port/linux-5.15-bringup
    paths:
      - '.github/workflows/probe-5.15-phase3-dream2lte-dtb.yml'
      - 'scripts/port5/prepare_dream2lte_dts_probe.py'
      - 'scripts/port5/fetch_android14_clang.sh'
  workflow_dispatch:

concurrency:
  group: dream2lte-5.15-direct-dtb
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  direct-dtb-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      COMMON_URL: https://android.googlesource.com/kernel/common
      COMMON_REF: refs/heads/android14-5.15
      COMMON_SHA: b10e5e5b5c5e01d49829aec34b65a0d717d6f2f5
      COMMON_TREE: 7c3cd26c765b741df608a8b81cc6b93f1240fa36
      DONOR_URL: https://github.com/boloaimer/exynos-8895.git
      DONOR_SHA: dcdaf6878e7f9497e1d90e25980decfa5d684f74
      DTB_TARGET: exynos/exynos8895-dream2lte_eur_open_10.dtb

    steps:
      - name: Checkout coordination branch
        uses: actions/checkout@v4
        with:
          ref: port/linux-5.15-bringup
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git libelf-dev libssl-dev \
            python3 rsync

      - name: Fetch pinned Android 14 Clang
        run: |
          set -euo pipefail
          chmod +x scripts/port5/fetch_android14_clang.sh
          scripts/port5/fetch_android14_clang.sh \
            "$RUNNER_TEMP/android-clang" \
            "$RUNNER_TEMP/android-clang.env"

      - name: Fetch exact Linux 5.15 destination and 4.4.302 donor
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/android-common-5.15"
          DONOR="$RUNNER_TEMP/exynos8895-linux-4.4.302"

          git init "$DEST"
          git -C "$DEST" remote add origin "$COMMON_URL"
          git -C "$DEST" fetch --depth=1 origin "$COMMON_REF"
          git -C "$DEST" checkout --detach FETCH_HEAD
          test "$(git -C "$DEST" rev-parse HEAD)" = "$COMMON_SHA"
          test "$(git -C "$DEST" rev-parse HEAD^{tree})" = "$COMMON_TREE"

          git init "$DONOR"
          git -C "$DONOR" remote add origin "$DONOR_URL"
          git -C "$DONOR" fetch --depth=1 origin "$DONOR_SHA"
          git -C "$DONOR" checkout --detach FETCH_HEAD
          test "$(git -C "$DONOR" rev-parse HEAD)" = "$DONOR_SHA"
          test "$(sed -n 's/^VERSION = //p' "$DONOR/Makefile")" = 4
          test "$(sed -n 's/^PATCHLEVEL = //p' "$DONOR/Makefile")" = 4
          test "$(sed -n 's/^SUBLEVEL = //p' "$DONOR/Makefile")" = 302

      - name: Overlay exact dream2lte DTS dependency closure
        run: |
          set -euo pipefail
          python3 scripts/port5/prepare_dream2lte_dts_probe.py \
            "$RUNNER_TEMP/exynos8895-linux-4.4.302" \
            "$RUNNER_TEMP/android-common-5.15" \
            dtb-evidence
          grep -qx 'migration=direct-4.4.302-to-5.15' \
            dtb-evidence/DTS_PROBE_STATUS.txt
          grep -qx 'linux_4_19_dependency=none' \
            dtb-evidence/DTS_PROBE_STATUS.txt
          grep -qx 'imported_files=26' \
            dtb-evidence/DTS_PROBE_STATUS.txt

      - name: Configure Android Common 5.15 for Exynos DTB
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/android-clang.env"
          export PATH="$ANDROID_CLANG_BIN:$PATH"
          DEST="$RUNNER_TEMP/android-common-5.15"
          OUT="$RUNNER_TEMP/out-5.15-dtb"

          make -C "$DEST" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS=-D__ANDROID_COMMON_KERNEL__ gki_defconfig \
            2>&1 | tee dtb-evidence/DTB_CONFIG.log
          "$DEST/scripts/config" --file "$OUT/.config" \
            -e ARCH_EXYNOS \
            -e OF \
            -e OF_EARLY_FLATTREE
          make -C "$DEST" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS=-D__ANDROID_COMMON_KERNEL__ olddefconfig \
            2>&1 | tee -a dtb-evidence/DTB_CONFIG.log
          cp "$OUT/.config" dtb-evidence/DTB_FINAL.config
          grep -qx 'CONFIG_ARCH_EXYNOS=y' dtb-evidence/DTB_FINAL.config

      - name: Compile dream2lte DTB directly on Linux 5.15
        run: |
          set +e
          set -o pipefail
          source "$RUNNER_TEMP/android-clang.env"
          export PATH="$ANDROID_CLANG_BIN:$PATH"
          DEST="$RUNNER_TEMP/android-common-5.15"
          OUT="$RUNNER_TEMP/out-5.15-dtb"
          make -C "$DEST" O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS=-D__ANDROID_COMMON_KERNEL__ -j2 "$DTB_TARGET" \
            2>&1 | tee dtb-evidence/DTB_BUILD.log
          status=${PIPESTATUS[0]}
          echo "$status" > dtb-evidence/DTB_EXIT_CODE.txt
          exit 0

      - name: Collect DTB evidence
        if: always()
        run: |
          set -u
          OUT="$RUNNER_TEMP/out-5.15-dtb"
          DTB="$OUT/arch/arm64/boot/dts/$DTB_TARGET"
          : > dtb-evidence/DTB_SHA256SUMS.txt
          if test -s "$DTB"; then
            cp "$DTB" dtb-evidence/exynos8895-dream2lte_eur_open_10.dtb
            sha256sum dtb-evidence/exynos8895-dream2lte_eur_open_10.dtb \
              > dtb-evidence/DTB_SHA256SUMS.txt
            file dtb-evidence/exynos8895-dream2lte_eur_open_10.dtb \
              > dtb-evidence/DTB_FILE.txt
          fi
          {
            cat dtb-evidence/DTS_PROBE_STATUS.txt 2>/dev/null || true
            echo "compile_exit=$(cat dtb-evidence/DTB_EXIT_CODE.txt 2>/dev/null || echo missing)"
            echo 'runtime_driver_support=not_tested'
            echo 'physical_boot=not_tested'
            echo 'one_ui_8=not_tested'
          } > dtb-evidence/DTB_RESULT.txt

      - name: Upload DTB probe evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream2lte-direct-4.4.302-to-5.15-dtb-probe
          path: dtb-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce DTB compile result
        run: exit "$(cat dtb-evidence/DTB_EXIT_CODE.txt)"
