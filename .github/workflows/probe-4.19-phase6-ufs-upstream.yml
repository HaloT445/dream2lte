name: Probe Android 4.19 phase 6 upstream Exynos UFS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ufs-upstream-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout materialized Linux 4.19 source
        uses: actions/checkout@v4
        with:
          ref: port/linux-4.19-source
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu libelf-dev libssl-dev python3 rsync

      - name: Fetch pinned upstream Linux 5.15 UFS source
        run: |
          mkdir linux-v5.15
          git -C linux-v5.15 init
          git -C linux-v5.15 remote add origin https://github.com/torvalds/linux.git
          git -C linux-v5.15 fetch --depth=1 origin refs/tags/v5.15
          git -C linux-v5.15 checkout --detach FETCH_HEAD
          test "$(git -C linux-v5.15 rev-parse HEAD)" = \
            "8bb7eca972ad531c9b149c0a51ab43a417385813"

      - name: Import isolated upstream Exynos UFS closure
        run: |
          cp linux-v5.15/drivers/scsi/ufs/ufs-exynos.c drivers/scsi/ufs/
          cp linux-v5.15/drivers/scsi/ufs/ufs-exynos.h drivers/scsi/ufs/
          cp linux-v5.15/drivers/phy/samsung/phy-samsung-ufs.c drivers/phy/samsung/
          cp linux-v5.15/drivers/phy/samsung/phy-samsung-ufs.h drivers/phy/samsung/
          cp linux-v5.15/drivers/phy/samsung/phy-exynos7-ufs.c drivers/phy/samsung/

          python3 - <<'PY'
          from pathlib import Path

          phy = Path('drivers/phy/samsung/phy-samsung-ufs.c')
          text = phy.read_text()
          text = text.replace(
              'static int samsung_ufs_phy_set_mode(struct phy *generic_phy,\n'
              '\t\t\t\t    enum phy_mode mode, int submode)',
              'static int samsung_ufs_phy_set_mode(struct phy *generic_phy,\n'
              '\t\t\t\t    enum phy_mode mode)')
          phy.write_text(text)

          host = Path('drivers/scsi/ufs/ufs-exynos.c')
          text = host.read_text()
          text = text.replace(
              '{ .compatible = "samsung,exynos7-ufs",',
              '{ .compatible = "samsung,exynos8895-ufs",')
          host.write_text(text)
          PY

          sha256sum \
            drivers/scsi/ufs/ufs-exynos.c \
            drivers/scsi/ufs/ufs-exynos.h \
            drivers/phy/samsung/phy-samsung-ufs.c \
            drivers/phy/samsung/phy-samsung-ufs.h \
            drivers/phy/samsung/phy-exynos7-ufs.c \
            > phase6-ufs-import-SHA256SUMS.txt

      - name: Configure UFS and generic PHY
        run: |
          set -o pipefail
          cat > phase6-ufs.config <<'EOF'
          CONFIG_SCSI=y
          CONFIG_SCSI_UFSHCD=y
          CONFIG_SCSI_UFSHCD_PLATFORM=y
          CONFIG_GENERIC_PHY=y
          EOF
          mkdir -p out-phase6-ufs
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            scripts/kconfig/merge_config.sh -O out-phase6-ufs \
            arch/arm64/configs/defconfig \
            arch/arm64/configs/alice_dream2lte_4_19_phase2.config \
            phase6-ufs.config \
            2>&1 | tee phase6-ufs-config.log
          cp out-phase6-ufs/.config phase6-ufs-final.config
          for sym in SCSI SCSI_UFSHCD SCSI_UFSHCD_PLATFORM GENERIC_PHY; do
            grep -qx "CONFIG_${sym}=y" phase6-ufs-final.config
          done

      - name: Compile upstream Exynos UFS closure
        run: |
          set +e
          set -o pipefail
          make O="$GITHUB_WORKSPACE/out-phase6-ufs" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare scripts
          make O="$GITHUB_WORKSPACE/out-phase6-ufs" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            drivers/scsi/ufs/ufs-exynos.o \
            drivers/phy/samsung/phy-samsung-ufs.o \
            drivers/phy/samsung/phy-exynos7-ufs.o \
            2>&1 | tee phase6-ufs-build.log
          status=${PIPESTATUS[0]}
          echo "$status" > phase6-ufs-exit-code.txt
          exit 0

      - name: Collect UFS probe evidence
        if: always()
        run: |
          : > phase6-ufs-object-SHA256SUMS.txt
          for obj in \
            out-phase6-ufs/drivers/scsi/ufs/ufs-exynos.o \
            out-phase6-ufs/drivers/phy/samsung/phy-samsung-ufs.o \
            out-phase6-ufs/drivers/phy/samsung/phy-exynos7-ufs.o; do
            if test -s "$obj"; then sha256sum "$obj" >> phase6-ufs-object-SHA256SUMS.txt; fi
          done
          {
            echo 'scope=object-closure-gate-only'
            echo 'kernel_target=4.19.325'
            echo 'source_host_phy=upstream-linux-v5.15'
            echo 'upstream_commit=8bb7eca972ad531c9b149c0a51ab43a417385813'
            echo 'compatible=samsung,exynos8895-ufs'
            echo 'vendor_4_4_ufshcd_core_copied=no'
            echo "compile_exit=$(cat phase6-ufs-exit-code.txt)"
            echo 'physical_storage=not_tested'
          } > phase6-ufs-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream2lte-linux-4.19-phase6-ufs-upstream-probe
          path: |
            phase6-ufs.config
            phase6-ufs-final.config
            phase6-ufs-config.log
            phase6-ufs-build.log
            phase6-ufs-exit-code.txt
            phase6-ufs-status.txt
            phase6-ufs-import-SHA256SUMS.txt
            phase6-ufs-object-SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce UFS compile result
        run: exit "$(cat phase6-ufs-exit-code.txt)"
